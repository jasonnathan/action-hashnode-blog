name: 'Hashnode Blog'
description: 'Pulls your latest blog post from Hashnode'

inputs:
  TYPE:
    description: "Set it to GIST if you are using this for a pinned gist"
    default: "gist"
    required: false
  BLOG_URL:
    description: "Your Hashnode blog URL (e.g., example.hashnode.dev, myblog.com)"
    required: true
  FILE:
    description: "Provide a GIST ID if TYPE is set to 'gist', otherwise provide a valid file path"
    default: "README.md"
    required: false
  STYLE:
    description: "Output style (e.g., list, list-ordered, blog, blog-grid-2)"
    default: 'list'
    required: false
  COUNT:
    description: "Number of latest posts to display"
    default: "6"
    required: false

branding:
  icon: 'book-open'
  color: 'blue'

runs:
  using: 'node20'
  main: 'dist/index.js'  # ✅ Must reference the bundled file, not src/index.js
