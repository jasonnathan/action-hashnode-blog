name: "🛠 Test Hashnode Action"

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches:
      - test-action  # Runs when pushing to a "test-action" branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📦 Install Dependencies"
        run: npm ci  # ✅ Ensures the right dependencies are installed

      - name: "🛠 Build Action"
        run: npm run prepare  # ✅ Builds the action with `ncc`

      - name: "🚀 Run Hashnode Blog Action"
        uses: ./  # ✅ Runs the locally built action
        with:
          BLOG_URL: "https://geekist.co"
          FILE: "README-TEST.md"
          STYLE: "blog-right"
          COUNT: "5"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
